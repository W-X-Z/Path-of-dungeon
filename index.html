<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>마왕의 미궁 노선도</title>
<meta name="description" content="침입 경로를 다시 그려 인간군을 막아내는 노선 설계 디펜스" />
<link rel="stylesheet" href="./styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M18 44h8v-8h8v8h8v-8h8v8h8v-8h8v8h8v-8h8v8v52H18Z M50 2 62 26H38Z' fill='%23a06bff'/></svg>" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">마왕의 미궁</div>
      <div class="gauge" id="castle-gauge">
        <span class="lbl">마왕성</span>
        <div class="track"><i id="castle-fill"></i></div>
        <b id="castle-value">100</b>
      </div>
      <div class="gauge budget" id="budget-gauge">
        <span class="lbl">남은 통로</span>
        <div class="track"><i id="budget-fill"></i></div>
        <b id="budget-value">0</b>
      </div>
      <button class="mute" id="mute" title="소리 끄기" aria-label="소리 끄기">♪</button>
      <div class="raid-chip" id="raid-chip"></div>
    </header>

    <main id="stage">
      <canvas id="map"></canvas>
      <div id="notice" hidden></div>
      <div id="tooltip" hidden></div>
      <div id="coach" hidden></div>
    </main>

    <aside id="panel"></aside>
  </div>

  <div id="overlay" hidden></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
